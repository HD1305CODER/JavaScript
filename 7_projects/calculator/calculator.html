<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="calculator">
        <div id="display">Display</div>
        <div class="buttons">

            <section class="row1">
                <button class="control-button" id="Clear">C</button>
                <button class="control-button" id="back">⌫</button class="control-button">
                <button  class="operator" id="percentage">%</button>
                <button  class="operator" id="divide">/</button>
            </section>
            
            <section class="row2">
                <button class="number" id="7">7</button>
                <button class="number" id="8">8</button>
                <button class="number" id="9">9</button>
                <button  class="operator" id="multiply">*</button>
            </section>

            <section class="row3">
                <button class="number" id="4">4</button>
                <button class="number" id="5">5</button>
                <button class="number" id="6">6</button>
                <button class="operator" id="minus">-</button>
            </section>

            <section class="row4">
                <button class="number" id="1">1</button>
                <button class="number" id="2">2</button>
                <button class="number" id="3">3</button>
                <button  class="operator" id="plus">+</button>
            </section>

            <section class="row5">
                <button class="control-button" id="@">@</button>
                <button class="number" id="0">0</button>
                <button class="number" id="dot">.</button>
                <button  class="control-button" id="equal">=</button>
            </section>
        </div>
    </div>
    <script src="calculator.js"></script>
</body>
</html>
