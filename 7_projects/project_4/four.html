<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="four.css">
</head>
<body>
    <div class="nav-bar">
        <a href="/" aria-current="page">Home</a>
    </div>
    <div class="main">
        <h2 class="title">Number Gusseing Game </h2>
         <p>Try and guess a random number between 1 and 10.</p>
        <p>You have 5 attempts to guess the right number.</p>
        <br>
        <div class="form">
            <label for="guseeNumber" id="Gusse">Gusse a Number</label>
            <input type="text" id="guessField" class="guessField">
            <input type="submit" id="submit" value="Submit Gusse">
        </div>
        <div class="resultParas">
            <p >Previous Guesses: <span class="guesses"></span></p>
            <p >Guesses Remaining: <span class="lastResult">5</span></p>
            <p class="lowOrHi"></p>
        </div>
    </div>
    <script src="four.js"></script>
</body>
</html>
